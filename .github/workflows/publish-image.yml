name: Publish Pterodactyl image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/publish-image.yml
  schedule:
    # Rebuild weekly so :latest tracks the upstream Hermes image.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-hermes-pterodactyl
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/apple050620312/hermespterodactyl
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hermes-pterodactyl:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the Pterodactyl runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          smoke_dir="$(mktemp -d)"
          sudo chown 988:988 "${smoke_dir}"

          container_id="$(docker run --detach \
            --user 988:988 \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,size=256m \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --volume "${smoke_dir}:/home/container" \
            --env HERMES_DASHBOARD=false \
            --env STARTUP='sleep 90' \
            hermes-pterodactyl:smoke)"

          cleanup() {
            docker inspect --format \
              'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' \
              "${container_id}" || true
            docker logs "${container_id}" || true
            echo "Persistent files:"
            sudo find "${smoke_dir}" -maxdepth 2 -printf '%P %s bytes\n' | sort || true
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
            sudo rm -rf "${smoke_dir}"
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 45); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "${container_id}")" != true ]]; then
              echo "Hermes container exited during bootstrap" >&2
              exit 1
            fi
            if sudo test -s "${smoke_dir}/config.yaml" && sudo test -s "${smoke_dir}/SOUL.md"; then
              ready=true
              break
            fi
            sleep 2
          done

          if [[ "${ready}" != true ]]; then
            echo "Hermes did not create its persistent files before the timeout" >&2
            exit 1
          fi

          sudo test -s "${smoke_dir}/.api-server-key"
          echo "Pterodactyl runtime smoke test passed"

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
